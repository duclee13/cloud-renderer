name: Render Handcrafted JSON Movie (Cloud VieNeu-TTS + 16 VMs)

on:
  workflow_dispatch:
    inputs:
      episode_file:
        description: 'Đường dẫn file kịch bản JSON trong web-studio/ (vd: episodes/khong_ngu_7_ngay_v16.json)'
        required: true
        default: 'episodes/khong_ngu_7_ngay_v16.json'
        type: string
      total_chapters:
        description: 'Số máy ảo render song song (mặc định 16 máy ảo ≈ 12-15 phút)'
        required: true
        default: '16'
        type: string
      output_name:
        description: 'Tên file video MP4 thành phẩm'
        required: true
        default: 'khong_ngu_7_ngay_v16.mp4'
        type: string
      preview_only:
        description: 'Chỉ xuất 4 ảnh xem trước (tắt để render trọn bộ phim)'
        required: false
        default: false
        type: boolean

jobs:
  plan_and_voice:
    name: Job 1 — Cloud VieNeu-TTS (Hải Đăng) từ Kịch Bản JSON
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix_chapters: ${{ steps.build_matrix.outputs.chapters }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache HuggingFace & uv models (VieNeu-TTS)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/uv
            ~/.cache/pip
          key: vieneu-tts-v3-${{ runner.os }}

      - name: Install FFmpeg & Chromium libs (with retry timeout)
        run: |
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3 install -y ffmpeg fonts-noto fonts-noto-color-emoji libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 || sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3 install -y ffmpeg fonts-noto

      - name: Install Web-Studio Dependencies
        working-directory: web-studio
        run: npm ci

      - name: Copy Handcrafted JSON to current_episode.json
        working-directory: web-studio
        run: |
          mkdir -p episodes
          cp "${{ inputs.episode_file }}" episodes/current_episode.json
          node -e "const d = JSON.parse(require('fs').readFileSync('episodes/current_episode.json','utf8')); console.log('Loaded:', d.title, '| Beats:', d.beats.length);"

      - name: Synthesize All Audio via Cloud VieNeu-TTS (Hải Đăng)
        working-directory: web-studio
        run: |
          python3 scripts/cloud_vieneu_tts.py --episode episodes/current_episode.json --voice "Hải Đăng" || python3 scripts/cloud_vieneu_tts.py --episode episodes/current_episode.json || python3 scripts/cloud_vieneu_tts.py
          node scripts/render_from_episode_json.mjs --episode=episodes/current_episode.json --audio-only

      - name: Render 4 Preview Stills (only if preview_only=true)
        if: ${{ inputs.preview_only == true }}
        working-directory: web-studio
        env:
          CI: 'true'
          REMOTION_GL: 'swangle'
        run: |
          npx remotion browser ensure
          node scripts/render_from_episode_json.mjs --episode=episodes/current_episode.json --preview-only

      - name: Upload Preview Stills Artifact
        if: ${{ inputs.preview_only == true }}
        uses: actions/upload-artifact@v4
        with:
          name: handcrafted-preview-stills
          path: |
            web-studio/out/preview_*.jpg
            web-studio/episodes/current_episode.json

      - name: Upload Episode + Audio Cache Bundle for 16 VMs
        if: ${{ inputs.preview_only == false }}
        uses: actions/upload-artifact@v4
        with:
          name: handcrafted-episode-bundle
          path: |
            web-studio/episodes/current_episode.json
            web-studio/.tts-cache/
            .tts-cache/
          if-no-files-found: ignore

      - name: Build Matrix Chapter Array
        id: build_matrix
        run: |
          N=${{ inputs.total_chapters }}
          ARR=$(seq -s, 1 "$N")
          echo "chapters=[$ARR]" >> $GITHUB_OUTPUT

  render_chunks:
    name: Job 2 — Render Chunk ${{ matrix.chapter }}/${{ inputs.total_chapters }}
    needs: plan_and_voice
    if: ${{ inputs.preview_only == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        chapter: ${{ fromJson(needs.plan_and_voice.outputs.matrix_chapters) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install FFmpeg & Headless Chromium Libraries (with timeout & retry)
        run: |
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3 install -y ffmpeg fonts-noto fonts-noto-color-emoji libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 || sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3 install -y ffmpeg fonts-noto

      - name: Install Web-Studio Dependencies
        working-directory: web-studio
        run: npm ci

      - name: Download Episode + Audio Bundle
        uses: actions/download-artifact@v4
        with:
          name: handcrafted-episode-bundle
          path: .

      - name: Ensure Remotion Headless Chrome
        working-directory: web-studio
        run: npx remotion browser ensure

      - name: Render Chunk ${{ matrix.chapter }}/${{ inputs.total_chapters }} (SwANGLE + JPEG 92)
        working-directory: web-studio
        env:
          CI: 'true'
          REMOTION_GL: 'swangle'
        run: |
          node scripts/render_from_episode_json.mjs --episode=episodes/current_episode.json --chapter=${{ matrix.chapter }} --total-chapters=${{ inputs.total_chapters }}

      - name: Upload Chunk MP4 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: json-chunk-${{ matrix.chapter }}
          path: web-studio/out/**/chapter_*.mp4

  stitch_final_movie:
    name: Job 3 — Stitch Final Movie (FFmpeg Lossless)
    needs: render_chunks
    if: ${{ inputs.preview_only == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3 install -y ffmpeg

      - name: Download All Chunks
        uses: actions/download-artifact@v4
        with:
          pattern: json-chunk-*
          path: chunks

      - name: Lossless FFmpeg Concat
        run: |
          N=${{ inputs.total_chapters }}
          rm -f concat_list.txt
          for i in $(seq 1 "$N"); do
            FILE=$(find "chunks/json-chunk-$i" -name "*.mp4" | head -n 1)
            if [ -z "$FILE" ]; then
              echo "ERROR: Missing chunk $i"
              exit 1
            fi
            echo "file '$(pwd)/$FILE'" >> concat_list.txt
          done
          cat concat_list.txt
          ffmpeg -y -f concat -safe 0 -i concat_list.txt -c copy "${{ inputs.output_name }}"
          ls -lh "${{ inputs.output_name }}"

      - name: Upload Final Movie Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-handcrafted-movie
          path: ${{ inputs.output_name }}
