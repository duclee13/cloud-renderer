name: Build & Push Remotion Render Base Image (GHCR)

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.render-base'
      - 'web-studio/package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_and_push_render_base:
    name: Build & Push ghcr.io/duclee13/cloud-renderer-base:latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Render Base Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.render-base
          push: true
          tags: |
            ghcr.io/duclee13/cloud-renderer-base:latest
            ghcr.io/duclee13/cloud-renderer-base:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
