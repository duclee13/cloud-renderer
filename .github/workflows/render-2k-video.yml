name: Distributed 1080p Video Renderer (Pre-Bundled 20-VM Balanced)

on:
  workflow_dispatch:
    inputs:
      scriptId:
        description: 'Identifier for the animation script'
        required: true
        default: 'story_001'
      totalFrames:
        description: 'Total number of frames to render (e.g. 13500 for 5 mins @ 45fps)'
        required: true
        default: '480'
      chunkCount:
        description: 'Number of parallel chunks (1 = Full single-runner, up to 20 = Parallel chunks)'
        required: true
        default: '20'
      scenePayloadUrl:
        description: 'Signed URL or raw JSON string containing the Scene Graph'
        required: false
        default: ''

permissions:
  contents: write
  packages: read

jobs:
  prepare-matrix:
    name: Pre-Bundle Once & Calculate Balanced Frame Chunks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      chunks: ${{ steps.set-matrix.outputs.chunks }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: web-studio/package-lock.json

      - name: Cache web-studio/node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: web-studio/node_modules
          key: web-studio-nm-${{ runner.os }}-node24-${{ hashFiles('web-studio/package-lock.json') }}

      - name: Install Dependencies & Pre-Bundle Remotion Once
        working-directory: web-studio
        run: |
          if [ "${{ steps.cache-node-modules.outputs.cache-hit }}" != "true" ]; then
            npm ci --prefer-offline || npm install --prefer-offline
          fi
          npx remotion bundle src/remotion/index.ts --out-dir build
          test -f build/index.html

      - name: Compute Strictly Balanced Frame Ranges & Write Props
        id: set-matrix
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let totalFrames = Math.max(1, parseInt('${{ github.event.inputs.totalFrames }}', 10) || 480);
            const requestedChunks = Math.max(1, Math.min(20, parseInt('${{ github.event.inputs.chunkCount }}', 10) || 1));
            const rawPayload = `${{ github.event.inputs.scenePayloadUrl }}`.trim();
            let payloadObj = { totalFrames };
            if (rawPayload && rawPayload.startsWith('{')) {
              try {
                const parsed = JSON.parse(rawPayload);
                const ir = parsed.ir || (parsed.timeline ? parsed : undefined);
                if (parsed.ir?.totalDurationFrames) {
                  totalFrames = parseInt(parsed.ir.totalDurationFrames, 10);
                } else if (parsed.totalDurationFrames) {
                  totalFrames = parseInt(parsed.totalDurationFrames, 10);
                } else if (parsed.totalDurationInFrames) {
                  totalFrames = parseInt(parsed.totalDurationInFrames, 10);
                } else if (Array.isArray(parsed.scenes) && parsed.scenes.length > 0) {
                  const maxEnd = parsed.scenes.reduce((acc, s) => {
                    const start = Number(s?.startFrame) || 0;
                    const dur = Number(s?.durationInFrames) || 120;
                    return Math.max(acc, start + dur);
                  }, 0);
                  if (maxEnd > 0) totalFrames = maxEnd;
                }
                payloadObj = {
                  totalFrames,
                  sceneGraph: parsed,
                  ...(ir ? { ir } : {}),
                  ...parsed,
                };
              } catch {}
            }
            fs.mkdirSync('dist', { recursive: true });
            fs.writeFileSync('dist/props.json', JSON.stringify(payloadObj));

            // Rational floor partition: max difference <= 1 frame across all workers, zero gap, zero overlap
            const maxValidChunks = totalFrames >= 2 ? Math.floor(totalFrames / 2) : 1;
            const safeChunks = Math.max(1, Math.min(maxValidChunks, requestedChunks));
            const chunks = [];
            for (let i = 0; i < safeChunks; i++) {
              const start = Math.floor((i * totalFrames) / safeChunks);
              const end = Math.floor(((i + 1) * totalFrames) / safeChunks) - 1;
              chunks.push({
                index: i,
                startFrame: start,
                endFrame: end,
                paddedIndex: String(i).padStart(3, '0')
              });
            }
            core.setOutput('chunks', JSON.stringify(chunks));

      - name: Upload Pre-Bundled Remotion & Props Artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotion-bundle
          compression-level: 1
          path: |
            web-studio/build/**
            dist/props.json
          if-no-files-found: error
          retention-days: 1

  render-chunk:
    name: Render Chunk ${{ matrix.chunk.paddedIndex }}
    needs: prepare-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/duclee13/cloud-renderer-base:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk: ${{ fromJson(needs.prepare-matrix.outputs.chunks) }}
    steps:
      - name: Download Pre-Bundled Remotion & Props
        uses: actions/download-artifact@v4
        with:
          name: remotion-bundle
          path: .

      - name: Link Prebuilt Node Modules & Render Video Chunk
        working-directory: web-studio
        env:
          START_FRAME: ${{ matrix.chunk.startFrame }}
          END_FRAME: ${{ matrix.chunk.endFrame }}
          CHUNK_INDEX: ${{ matrix.chunk.paddedIndex }}
        run: |
          rm -rf node_modules
          ln -s /opt/render-env/node_modules node_modules
          mkdir -p ../dist/chunks
          echo "Rendering frames $START_FRAME to $END_FRAME (Chunk $CHUNK_INDEX)..."
          node node_modules/@remotion/cli/remotion-cli.js render ./build MainScene ../dist/chunks/chunk_${CHUNK_INDEX}.mp4 \
            --frames=${START_FRAME}-${END_FRAME} \
            --props=../dist/props.json \
            --pixel-format=yuv420p \
            --codec=h264 \
            --image-format=jpeg \
            --jpeg-quality=88 \
            --x264-preset=superfast \
            --crf=23 \
            --concurrency=4 \
            --gl=swangle \
            --log=error

      - name: Upload Chunk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk.paddedIndex }}
          path: dist/chunks/chunk_${{ matrix.chunk.paddedIndex }}.mp4
          retention-days: 1

  stitch-and-release:
    name: Assemble & Publish 1080p Video
    needs: [prepare-matrix, render-chunk]
    if: always() && needs.prepare-matrix.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository (Shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg || true

      - name: Download All Chunk Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_chunks
          pattern: chunk-*
          merge-multiple: true

      - name: Assemble Video (Full Mode or Concat)
        run: |
          mkdir -p output
          ls -lah downloaded_chunks/

          CHUNK_FILES=( $(ls downloaded_chunks/chunk_*.mp4 2>/dev/null | sort -V) )
          COUNT=${#CHUNK_FILES[@]}
          echo "Tìm thấy $COUNT chunk video."

          if [ "$COUNT" -eq 0 ]; then
            echo "LỖI: Không tìm thấy file chunk video nào được render!"
            exit 1
          fi

          if [ "$COUNT" -eq 1 ]; then
            cp "${CHUNK_FILES[0]}" output/final_raw.mp4
          else
            for f in "${CHUNK_FILES[@]}"; do
              echo "file '$PWD/$f'" >> concat_list.txt
            done
            ffmpeg -y -v error -f concat -safe 0 -i concat_list.txt -c copy output/final_raw.mp4
          fi

          ffmpeg -y -v error -i output/final_raw.mp4 -c copy -movflags +faststart output/story_${{ github.event.inputs.scriptId }}_1080p60fps.mp4

      - name: Create GitHub Release and Upload 1080p Video
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: render-${{ github.event.inputs.scriptId }}-${{ github.run_id }}
          name: "Render 1080p: ${{ github.event.inputs.scriptId }}"
          body: |
            ### Automated Render Completion
            - **Script ID:** `${{ github.event.inputs.scriptId }}`
            - **Resolution:** `1920x1080 (Full HD)`
            - **Total Frames:** `${{ github.event.inputs.totalFrames }}`
            - **Parallel Chunks:** `${{ github.event.inputs.chunkCount }}`
          files: output/story_${{ github.event.inputs.scriptId }}_1080p60fps.mp4
          draft: false
          prerelease: false
