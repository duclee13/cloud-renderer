  <path d="M210 85 L225 85 L225 150 L215 150 Z" fill="#333" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>

  <!-- Layer 5: Ambient Occlusion & 3D Depth -->
  <path d="M195 80 L195 380" fill="none" stroke="#000" stroke-width="2" opacity="0.2"/>
  <path d="M198 80 L198 380" fill="none" stroke="#FFF" stroke-width="2" opacity="0.2"/>

  <!-- Layer 6: Specular Highlights -->
  <path d="M202 90 L202 370" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
  <path d="M208 90 L208 370" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>