  <path d="M190 80 L210 80 L205 380 L195 380 Z" fill="url(#penBodyGrad)" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Layer 3: Tip/Nib -->
  <path d="M195 380 L205 380 L202 390 L198 390 Z" fill="#FFD700" stroke="#1A1A1A" stroke-width="6" stroke-linejoin="round"/>

