<svg viewBox="0 0 400 400" width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="penBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2D5A27;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4A9142;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D5A27;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Layer 1: Ground contact shadow -->
  <ellipse cx="200" cy="380" rx="40" ry="8" fill="#000000" opacity="0.2"/>

